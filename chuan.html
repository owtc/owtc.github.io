<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>z本地互传 · 稳定版</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/webconnect@0.0.10/dist/umd/webconnect.js"></script>
    <script src="https://unpkg.com/p2pt@1.6.2/dist/p2pt.iife.js"></script>
    <style>
        :root { --bg: #f5f7fa; --card: #fff; --primary: #007aff; --text: #1d1d1f; --border: #e5e5ea; --radius: 16px; --danger: #ff3b30; --success: #34c759; --refresh: #ff9500; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid var(--border); }
        .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: nowrap; }
        .status-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; background: #e9e9ef; white-space: nowrap; }
        .status-badge.connected { background: #e8f5e9; color: #2e7d32; }
        .status-badge.connecting { background: #fff3cd; color: #856404; }
        .status-badge.disconnected { background: #ffebee; color: #b71c1c; }
        .network-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: #e0e0e0; white-space: nowrap; }
        .network-badge.online { background: #e8f5e9; color: #2e7d32; }
        .network-badge.offline { background: #ffebee; color: #b71c1c; }
        .btn { padding: 10px 16px; border: none; border-radius: 10px; font-weight: 600; background: var(--primary); color: #fff; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
        .btn-sm { padding: 7px 12px; font-size: 0.8rem; border-radius: 8px; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-refresh { background: var(--refresh); color: #fff; }
        input, textarea { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 12px; margin: 4px 0; font-size: 0.9rem; }
        .radio-group { display: flex; align-items: center; gap: 12px; margin: 6px 0; flex-wrap: nowrap; overflow-x: auto; }
        .radio-group label { font-size: 0.85rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
        .tracker-lines { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px 16px; margin: 4px 0 8px 0; }
        .tracker-lines label { font-size: 0.82rem; display: flex; align-items: center; gap: 3px; white-space: nowrap; cursor: pointer; }
        .donate-container { display: flex; flex-direction: column; align-items: center; }
        .donate-text { font-size: 0.8rem; font-weight: 700; color: #ff3b30; margin-bottom: 4px; }
        .donate-img-thumb { width: 120px; height: 120px; border-radius: 4px; cursor: pointer; border: 1px solid #ddd; object-fit: cover; }
        .messages { background: #f9f9fb; border-radius: 12px; padding: 10px; height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { padding: 8px 12px; border-radius: 18px; font-size: 0.85rem; max-width: 80%; word-break: break-word; animation: fadeIn 0.2s ease-out; }
        .msg-sent { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #e9e9ef; color: var(--text); border-bottom-left-radius: 4px; }
        .msg-system { align-self: center; background: #fff3cd; color: #856404; font-size: 0.78rem; border-radius: 12px; }
        .msg-error { align-self: center; background: #ff3b30; color: #fff; font-size: 0.78rem; border-radius: 12px; }
        .msg-sdp { align-self: flex-start; background: #e8f5e9; color: #1b5e20; font-family: monospace; font-size: 0.65rem; white-space: pre-wrap; word-break: break-all; border-left: 3px solid #4caf50; }
        .msg-time { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; text-align: left; }
        .msg-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; font-size: 0.7rem; }
        .msg-actions button { background: rgba(255,255,255,0.25); border: none; color: inherit; padding: 2px 8px; border-radius: 10px; cursor: pointer; font-size: 0.7rem; backdrop-filter: blur(4px); transition: background 0.15s; }
        .msg-sent .msg-actions button { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.2); }
        .msg-received .msg-actions button { color: var(--text-secondary); background: rgba(0,0,0,0.08); }
        .drop-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 15px; text-align: center; margin: 6px 0; cursor: pointer; font-size: 0.9rem; }
        .file-item { display: flex; align-items: center; gap: 6px; background: #e8f5e9; padding: 6px; border-radius: 8px; margin: 3px 0; font-size: 0.8rem; }
        .file-item button { background: #4caf50; color: #fff; border: none; padding: 3px 8px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; }
        .file-item .btn-delete { background: var(--danger); }
        .info-row { font-size: 0.75rem; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; }
        .session-row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
        .session-row input { flex: 1; min-width: 0; margin: 0; padding: 8px; }
        #qrImage { width: 36px; height: 36px; border: 1px solid #ddd; border-radius: 4px; flex-shrink: 0; display: none; cursor: pointer; margin-right: 4px; }
        #btnScanQR, #btnRandom { flex-shrink: 0; white-space: nowrap; margin: 0; padding: 6px 10px; font-size: 0.8rem; }
        .qr-error-text { font-size: 0.6rem; color: var(--danger); margin-left: 2px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .modal-content img { width: 256px; height: 256px; }
        .modal-close { margin-top: 16px; padding: 8px 20px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; }
        .donate-img { max-width: 80vw; max-height: 70vh; cursor: pointer; border-radius: 8px; }
        .top-ads { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
        .ad-slot { display: none; width: 100px; height: 100px; background: #f0f0f0; border: 1px dashed #ccc; }
        .bottom-stats { width: 100%; max-width: 580px; margin-top: 8px; text-align: center; }
        .stats-slot { display: none; width: 100%; height: 50px; background: #f0f0f0; border: 1px dashed #ccc; line-height: 50px; color: #999; font-size: 0.7rem; }
        .ipv6-info-label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: var(--text-secondary); margin: 4px 0; white-space: nowrap; }
        .tracker-title { font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; white-space: nowrap; }
        .btn-group-mode1, .btn-group-mode2 { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
        .btn-group-mode2 { display: none; flex-direction: column; align-items: flex-start; }
        .mode2-hint { font-size: 0.75rem; color: #e67e22; margin-top: 6px; display: none; }
        .env-warning { background: #fff3cd; border-radius: 8px; padding: 6px 10px; font-size: 0.7rem; color: #856404; margin-top: 6px; display: none; }
    </style>
</head>
<body>
    <div class="top-ads"><div class="ad-slot"></div><div class="ad-slot"></div><div class="ad-slot"></div><div class="ad-slot"></div><div class="ad-slot"></div></div>

    <div class="container">
        <div style="text-align:center;"><h1 style="margin:0;">z本地互传</h1></div>
        <div class="card">
            <div class="status-row">
                <span id="statusDot" style="width:10px;height:10px;border-radius:50%;background:#bbb;"></span>
                <span class="status-badge disconnected" id="statusBadge">未连接</span>
                <span class="network-badge" id="mode1Badge">模式1检测中...</span>
                <span class="network-badge" id="networkBadge">检测中...</span>
            </div>

            <label style="font-size:0.85rem;">📛 会话名称（模式2需要填写并相同）</label>
            <div class="session-row">
                <input type="text" id="sessionName" placeholder="自动生成或输入">
                <button class="btn btn-sm btn-outline" id="btnRandom" title="随机生成">🔄</button>
                <img id="qrImage" src="" alt="二维码">
                <button class="btn btn-sm btn-outline" id="btnScanQR">📷 扫描</button>
                <span id="qrError" class="qr-error-text"></span>
            </div>
            <div id="qrReader" style="width:100%; margin-top:6px;"></div>

            <div class="radio-group">
                <label><input type="radio" name="modeType" value="local"> 模式1</label>
                <label><input type="radio" name="modeType" value="p2pt"> 模式2</label>
            </div>

            <div id="trackerSelection" style="display:none;">
                <div class="tracker-title">📡 模式2下（两端线路必须一致）</div>
                <div class="tracker-lines" id="trackerRadios"></div>
            </div>

            <div style="display: flex; align-items: center; margin: 6px 0;">
                <div style="flex: 1; display: flex; gap: 12px; align-items: center;">
                    <label><input type="radio" name="netType" value="lan"> 🏠 局域网连接</label>
                    <label><input type="radio" name="netType" value="wan"> 🌐 公网连接 (IPv6)</label>
                </div>
                <div style="flex: 1; display: flex; justify-content: center;">
                    <div class="donate-container">
                        <span class="donate-text">求打赏</span>
                        <img class="donate-img-thumb" id="donateThumb" src="./self.jpg" alt="打赏二维码" title="点击放大">
                    </div>
                </div>
            </div>

            <p class="ipv6-info-label" id="ipv6InfoRow" style="display: none;">
                <span>🛰️ IPv6 支持：</span><span id="ipv6SupportText">检测中...</span>
            </p>

            <p class="info-row">🔘 当前模式：<span id="connModeDisplay">模式1</span></p>
            <p class="info-row" id="myIdRow" style="display:none;">🆔 本机ID：<span id="myIdDisplay">--</span></p>
            <p class="info-row" id="peerIdRow" style="display:none;">🆔 对方ID：<span id="peerIdDisplay">--</span></p>
            <p class="info-row">🔗 对方IP：<span id="remoteIPDisplay">等待连接...</span></p>

            <!-- 环境提示 -->
            <div class="env-warning" id="envWarning"></div>

            <div class="btn-group-mode1" id="btnGroupMode1">
                <button class="btn" id="btnStart">🚀 启动连接</button>
                <button class="btn btn-refresh" id="btnRefresh">🔄 重新连接</button>
                <button class="btn btn-danger" id="btnStop">⏹ 断开连接</button>
            </div>
            <div class="btn-group-mode2" id="btnGroupMode2">
                <button class="btn" id="btnHost">📤 创建邀请</button>
                <button class="btn btn-outline" id="btnJoin">📥 加入连接</button>
                <div class="mode2-hint" id="mode2Hint">⚠️ 等A端创建邀请提示:已连接!!!再点加入连接</div>
            </div>
        </div>

        <div class="card">
            <div class="messages" id="messageBox"></div>
            <div id="receiveProgress" style="display:none; margin: 6px 0;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="receiveLabel"></span><span id="receivePercent">0%</span>
                    <button class="btn btn-sm btn-danger" id="btnStopReceive" style="margin-left:6px;">停止</button>
                </div>
                <div style="height:4px;background:#e0e0e0; border-radius:2px; margin-top:4px;">
                    <div id="receiveBar" style="height:100%;width:0%;background:var(--primary); border-radius:2px;"></div>
                </div>
            </div>
            <div id="receivedFiles"></div>
            <div class="drop-zone" id="dropZone">📁 拖拽文件到此处（或点击下方选择文件）</div>
            <div style="display:flex;gap:6px;margin-top:8px;">
                <input type="text" id="sendInput" placeholder="输入消息..." style="flex:1; padding:8px;">
                <button class="btn btn-sm" id="btnSend">发送</button>
                <label class="btn btn-sm btn-outline" style="cursor:pointer;">📎 选择文件<input type="file" id="fileInput" style="display:none;"></label>
            </div>
            <button class="btn btn-sm btn-outline" id="btnClear" style="margin-top:6px;">🗑️ 清空聊天</button>
        </div>
    </div>

    <div class="bottom-stats"><div class="stats-slot">统计广告位</div></div>

    <div class="modal-overlay" id="qrModal">
        <div class="modal-content"><img id="qrLargeImage" src="" alt="放大二维码"><br><button class="modal-close" id="btnCloseModal">关闭</button></div>
    </div>
    <div class="modal-overlay" id="donateModal">
        <div class="modal-content"><img id="donateImg" class="donate-img" src="./self.jpg" alt="打赏二维码"><br><button class="modal-close" id="btnCloseDonate">关闭</button></div>
    </div>

    <script>
    (() => {
        const $ = id => document.getElementById(id);

        // 消息系统
        let messages = [];
        function addMsg(text, type = 'system') {
            messages.push({ text, type, time: new Date().toLocaleTimeString('zh-CN', { hour12: false }) });
            renderMessages();
        }
        function renderMessages() {
            const box = $('messageBox');
            box.innerHTML = '';
            messages.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = `msg msg-${m.type}`;
                const textSpan = document.createElement('div'); textSpan.textContent = m.text; div.appendChild(textSpan);
                if (m.type === 'sent' || m.type === 'received') {
                    const timeDiv = document.createElement('div'); timeDiv.className = 'msg-time'; timeDiv.textContent = m.time; div.appendChild(timeDiv);
                    const actionsDiv = document.createElement('div'); actionsDiv.className = 'msg-actions';
                    const copyBtn = document.createElement('button'); copyBtn.textContent = '📋 复制'; copyBtn.onclick = (e) => { e.stopPropagation(); navigator.clipboard.writeText(m.text).then(() => addMsg('📋 已复制')).catch(() => addMsg('❌ 复制失败', 'error')); };
                    const delBtn = document.createElement('button'); delBtn.textContent = '🗑 删除'; delBtn.onclick = (e) => { e.stopPropagation(); messages.splice(idx, 1); renderMessages(); };
                    actionsDiv.appendChild(copyBtn); actionsDiv.appendChild(delBtn); div.appendChild(actionsDiv);
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        // 错误处理
        window.addEventListener('error', e => {
            if (e.message && (e.message.includes('Connection failed') || e.message.includes('webconnect'))) {
                addMsg('⚠️ 连接异常，可刷新重试', 'error'); e.preventDefault();
            }
        });
        window.addEventListener('unhandledrejection', e => {
            if (e.reason && e.reason.message && e.reason.message.includes('Connection failed')) {
                addMsg('⚠️ 连接异常，可刷新重试', 'error'); e.preventDefault();
            }
        });

        // 环境检测
        function checkEnvironment() {
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const warningEl = $('envWarning');
            let warnings = [];
            if (isMobile) warnings.push('📱 移动端可能不支持局域网发现（模式1），建议使用模式2。');
            if (!isSecure) warnings.push('🔒 非安全连接（HTTP）无法使用摄像头扫描，请使用 HTTPS 或手动输入会话名称。');
            if (warnings.length > 0) {
                warningEl.innerHTML = warnings.join('<br>');
                warningEl.style.display = 'block';
            }
        }

        // AES
        const ENCRYPTION_KEY = '540022758';
        async function deriveAesKey() { /* 完整同前 */ }
        async function encryptSDP(sdp) { /* 完整同前 */ }
        async function decryptSDP(encBase64) { /* 完整同前 */ }

        // Tracker
        const TRACKERS = [ 'wss://tracker.openwebtorrent.com', 'wss://tracker.btorrent.xyz', 'wss://tracker.webtorrent.dev', 'wss://tracker.fastcast.nz', 'wss://tracker.files.fm:7073/announce', 'wss://spacetradersapi-chatbox.herokuapp.com:443/announce' ];
        const trackerRadiosContainer = $('trackerRadios');
        TRACKERS.forEach((url, i) => { const label = document.createElement('label'); label.innerHTML = `<input type="radio" name="trackerLine" value="${i}" ${i===0?'checked':''}> 线路${i+1}`; trackerRadiosContainer.appendChild(label); });

        // 全局状态
        let currentMode = 'local', networkMode = 'lan';
        let pc = null, chatChannel = null, fileChannel = null, connected = false, isHost = false;
        let currentSignalSender = null;
        let wcInstance = null, wcPeerId = null, iceCache = [], creatingOffer = false;
        let receivingFile = null, receivedFileList = [], abortReceive = false;
        let p2ptInstance = null, remotePeer = null;
        let heartbeatTimer = null, lastPongTime = 0;
        let wakeLock = null;
        let mode1Active = false;
        let myId = null;
        let retryTimer = null;
        let activeWc = null;
        let roleNegotiated = false;
        let peerRoleId = null;
        let autoRetryInterval = null;
        let pcCreationLock = false;

        // 辅助函数
        const randomName = () => Math.random().toString(36).substring(2,14);
        const sessionInput = $('sessionName');
        let stored = localStorage.getItem('snap_session_name');
        if (!stored) { stored = randomName(); localStorage.setItem('snap_session_name', stored); }
        sessionInput.value = stored;

        const generateQR = (text) => { /* 完整同前 */ };
        generateQR(sessionInput.value);
        sessionInput.addEventListener('input', () => { localStorage.setItem('snap_session_name', sessionInput.value); generateQR(sessionInput.value); });

        // 二维码放大、打赏、随机名称、摄像头扫描（优化错误提示）
        // ...（省略界面交互代码，保持原有完整功能）
        // 摄像头扫描增加详细错误提示
        $('btnScanQR').addEventListener('click', async () => {
            if (typeof Html5Qrcode === 'undefined') { addMsg('❌ 扫码库未加载', 'error'); return; }
            cleanupScanner();
            try {
                const devices = await Html5Qrcode.getCameras();
                if (!devices.length) { addMsg('❌ 未找到摄像头，请检查权限或使用手动输入', 'error'); return; }
                let cameraId = devices[0].id;
                devices.forEach(d => { if (d.label.toLowerCase().includes('back')) cameraId = d.id; });
                qrScanner = new Html5Qrcode("qrReader");
                await qrScanner.start(cameraId, { fps: 30, qrbox: 150 }, (decoded) => {
                    sessionInput.value = decoded; localStorage.setItem('snap_session_name', decoded);
                    generateQR(decoded); cleanupScanner(); addMsg('✅ 扫码成功');
                }, (err) => {});
            } catch (err) {
                cleanupScanner();
                let errMsg = '摄像头启动失败';
                if (err.name === 'NotAllowedError') errMsg += '：请允许摄像头权限';
                else if (err.name === 'NotFoundError') errMsg += '：未找到摄像头设备';
                else if (err.message) errMsg += '：' + err.message;
                addMsg('❌ ' + errMsg, 'error');
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                    addMsg('💡 提示：非 HTTPS 页面无法使用摄像头，请手动输入或部署到安全环境', 'system');
                }
            }
        });

        // 模式切换
        const radioModeLocal = document.querySelector('input[value="local"]');
        const radioModeP2PT = document.querySelector('input[value="p2pt"]');
        const savedMode = localStorage.getItem('connMode') || 'local';
        if (savedMode === 'p2pt') { radioModeP2PT.checked = true; currentMode = 'p2pt'; $('connModeDisplay').textContent = '模式2'; $('trackerSelection').style.display = 'block'; }
        else { radioModeLocal.checked = true; currentMode = 'local'; $('connModeDisplay').textContent = '模式1'; $('trackerSelection').style.display = 'none'; }
        function updateButtonGroups() {
            $('btnGroupMode1').style.display = currentMode === 'local' ? 'flex' : 'none';
            $('btnGroupMode2').style.display = currentMode === 'p2pt' ? 'flex' : 'none';
            $('mode2Hint').style.display = currentMode === 'p2pt' ? 'block' : 'none';
            // 模式1时如果移动端，显示额外提示
            if (currentMode === 'local' && /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                addMsg('⚠️ 移动端模式1可能不可用，建议切换到模式2', 'system');
            }
        }
        updateButtonGroups();

        // 网络类型、IPv6 检测等省略（同前）

        // 模式2 连接增强日志
        async function connectP2PT(room, role) {
            cleanupP2PT(); const trackerUrl = getSelectedTracker();
            addMsg('🔌 正在连接 Tracker...');
            addMsg('📍 线路：' + trackerUrl, 'system');
            try { p2ptInstance = new window.P2PT([trackerUrl], room); } catch (e) { addMsg('❌ 初始化失败: ' + e.message, 'error'); return false; }

            p2ptInstance.on('trackerconnect', () => { addMsg('✅ 已连接到 Tracker', 'success'); addMsg('🕒 等待对方加入房间（会话名：' + room + '）...', 'system'); });
            p2ptInstance.on('trackerwarning', (err) => addMsg(`⚠️ Tracker 警告: ${(err||'').replace(/tracker/gi, '线路')}`, 'error'));
            p2ptInstance.on('trackererror', (err) => addMsg(`❌ Tracker 错误: ${(err||'').replace(/tracker/gi, '线路')}`, 'error'));
            // ...其余同前
        }

        // 模式1 核心（保留高速重试等）

        // 启动时运行环境检测
        checkEnvironment();
