<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>本地快传 · Gitee 信令</title>
    <!-- 二维码库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg: #f5f7fa; --card: #fff; --primary: #007aff; --primary-light: #e8f0fe;
            --text: #1d1d1f; --text-secondary: #6e6e73; --border: #e5e5ea;
            --radius: 16px; --danger: #ff3b30; --success: #34c759;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            position: relative;
        }
        .container { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid var(--border); }
        .status-badge { font-size: 0.8rem; padding: 3px 12px; border-radius: 20px; font-weight: 600; background: #e9e9ef; }
        .status-badge.connected { background: #e8f5e9; color: #2e7d32; }
        .status-badge.connecting { background: #fff3cd; color: #856404; }
        .status-badge.disconnected { background: #ffebee; color: #b71c1c; }
        .network-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: #e0e0e0; }
        .network-badge.online { background: #e8f5e9; color: #2e7d32; }
        .network-badge.offline { background: #ffebee; color: #b71c1c; }
        .btn {
            padding: 12px 18px; border: none; border-radius: 12px; font-weight: 600;
            background: var(--primary); color: #fff; cursor: pointer; transition: 0.2s;
            white-space: nowrap;
        }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
        .btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: 8px; }
        .btn-danger { background: var(--danger); color: #fff; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; margin: 6px 0; }
        .radio-group {
            display: flex; gap: 16px; align-items: center; margin: 8px 0;
            flex-wrap: wrap;
        }
        .radio-group label { display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; font-size: 0.85rem; }
        .donate-container {
            display: flex; flex-direction: column; align-items: center; margin-left: 20px;
        }
        .donate-text { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 2px; }
        .donate-img-thumb {
            width: 150px; height: 150px;
            border-radius: 4px; cursor: pointer; border: 1px solid #ddd;
            object-fit: cover;
        }
        .messages { background: #f9f9fb; border-radius: 12px; padding: 12px; height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg {
            padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; position: relative;
            max-width: 80%; word-break: break-word; animation: fadeIn 0.2s ease-out;
        }
        .msg-sent { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
        .msg-received { align-self: flex-start; background: #e9e9ef; color: var(--text); border-bottom-left-radius: 4px; }
        .msg-system { align-self: center; background: #fff3cd; color: #856404; font-size: 0.78rem; border-radius: 12px; }
        .msg-actions {
            display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; font-size: 0.7rem;
        }
        .msg-actions button {
            background: rgba(255,255,255,0.25); border: none; color: inherit; padding: 2px 8px;
            border-radius: 10px; cursor: pointer; font-size: 0.7rem; backdrop-filter: blur(4px);
            transition: background 0.15s;
        }
        .msg-sent .msg-actions button { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.2); }
        .msg-received .msg-actions button { color: var(--text-secondary); background: rgba(0,0,0,0.08); }
        .msg-actions button:active { background: rgba(0,0,0,0.2); }
        .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; margin: 8px 0; cursor: pointer; }
        .file-item { display: flex; align-items: center; gap: 8px; background: #e8f5e9; padding: 8px; border-radius: 8px; margin: 4px 0; }
        .file-item button { background: #4caf50; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
        .file-item .btn-delete { background: var(--danger); }
        .info-row { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

        .session-row {
            display: flex; align-items: center; gap: 6px; margin: 8px 0;
            flex-wrap: nowrap;
        }
        .session-row input { flex: 1; min-width: 0; margin: 0; }
        #qrImage {
            width: 36px; height: 36px; border: 1px solid #ddd; border-radius: 4px;
            flex-shrink: 0; display: none; cursor: pointer;
        }
        #btnScanQR, #btnRandom {
            flex-shrink: 0; white-space: nowrap; margin: 0;
        }
        .qr-error-text {
            font-size: 0.65rem; color: var(--danger); margin-left: 2px; flex-shrink: 0;
        }
        .hint-text { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #fff; border-radius: 16px; padding: 24px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .modal-content img { width: 256px; height: 256px; }
        .modal-close {
            margin-top: 16px; padding: 8px 20px; border: none; border-radius: 8px;
            background: var(--primary); color: #fff; font-weight: 600; cursor: pointer;
        }
        .donate-img {
            max-width: 80vw; max-height: 70vh; cursor: pointer;
            border-radius: 8px;
        }

        /* 广告占位 */
        .ad-placeholder {
            position: fixed; width: 120px; height: 120px;
            background: transparent; visibility: hidden; pointer-events: none; z-index: -1;
        }
        .ad-left-top { top: 10px; left: 10px; }
        .ad-right-top { top: 10px; right: 10px; }
        .ad-left-bottom { bottom: 10px; left: 10px; }
        .ad-right-bottom { bottom: 10px; right: 10px; }
        .ad-bottom-center { bottom: 10px; left: 50%; transform: translateX(-50%); width: 320px; height: 60px; }
    </style>
</head>
<body>
    <div class="ad-placeholder ad-left-top" id="adLeftTop"></div>
    <div class="ad-placeholder ad-right-top" id="adRightTop"></div>
    <div class="ad-placeholder ad-left-bottom" id="adLeftBottom"></div>
    <div class="ad-placeholder ad-right-bottom" id="adRightBottom"></div>
    <div class="ad-placeholder ad-bottom-center" id="adBottomCenter" title="IP 统计预留位"></div>

    <div class="container">
        <div style="text-align:center;"><h1>🫧 本地快传</h1></div>
        <div class="card">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
                <span id="statusDot" style="width:10px;height:10px;border-radius:50%;background:#bbb;"></span>
                <span class="status-badge disconnected" id="statusBadge">未连接</span>
                <span class="network-badge" id="networkBadge">检测网络...</span>
            </div>
            <label>📛 会话名称（双方保持一致）</label>
            <div class="session-row">
                <input type="text" id="sessionName" placeholder="输入会话名">
                <button class="btn btn-sm btn-outline" id="btnRandom" title="随机生成名称">🔄</button>
                <img id="qrImage" src="" alt="二维码" style="display:none; width:36px; height:36px; border:1px solid #ddd; border-radius:4px; cursor:pointer;">
                <button class="btn btn-sm btn-outline" id="btnScanQR">📷 扫描</button>
                <span id="qrError" class="qr-error-text"></span>
            </div>
            <div class="hint-text">名称可自定义，或点击 🔄 随机生成</div>
            <div id="qrReader" style="width:100%; margin-top:8px;"></div>
            <div class="radio-group">
                <label><input type="radio" name="netType" value="lan" checked> 🏠 局域网连接</label>
                <label><input type="radio" name="netType" value="wan"> 🌐 公网连接 (IPv6)</label>
                <div class="donate-container">
                    <span class="donate-text">求打赏</span>
                    <img class="donate-img-thumb" id="donateThumb" src="https://gitee.com/owtc/owtc/raw/master/tu/self.jpg" alt="打赏二维码" title="点击放大">
                </div>
            </div>
            <p class="info-row">当前连接方式：<span id="connModeDisplay">内网连接</span></p>
            <p class="info-row">🌐 您的公网IP：<span id="ipDisplay">获取中...</span></p>
            <p class="info-row">🛰️ IPv6 公网支持：<span id="ipv6SupportDisplay" style="font-weight:600;">正在测试...</span></p>
            <p class="info-row">🔗 对方IP：<span id="remoteIPDisplay" style="font-weight:600;">等待连接...</span></p>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn" id="btnHost">📤 创建邀请</button>
                <button class="btn btn-outline" id="btnJoin">📥 加入连接</button>
            </div>
        </div>
        <div class="card">
            <div class="messages" id="messageBox"><div class="msg msg-system">等待网络就绪...</div></div>
            <div id="receiveProgress" style="display:none; margin: 8px 0;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="receiveLabel"></span>
                    <span id="receivePercent">0%</span>
                    <button class="btn btn-sm btn-danger" id="btnStopReceive" style="margin-left:8px;">停止</button>
                </div>
                <div style="height:5px;background:#e0e0e0; border-radius:3px; margin-top:4px;">
                    <div id="receiveBar" style="height:100%;width:0%;background:var(--primary); border-radius:3px; transition:width 0.2s;"></div>
                </div>
            </div>
            <div id="receivedFiles"></div>
            <div class="drop-zone" id="dropZone">📁 拖拽文件到此处（或点击下方选择文件）</div>
            <div style="display:flex;gap:8px;margin-top:8px;">
                <input type="text" id="sendInput" placeholder="输入消息..." style="flex:1;">
                <button class="btn btn-sm" id="btnSend">发送</button>
                <label class="btn btn-sm btn-outline" style="cursor:pointer;">📎 选择文件<input type="file" id="fileInput" style="display:none;"></label>
            </div>
            <button class="btn btn-sm btn-outline" id="btnClear">🗑️ 清空聊天</button>
        </div>
    </div>

    <div class="modal-overlay" id="qrModal">
        <div class="modal-content">
            <img id="qrLargeImage" src="" alt="放大二维码">
            <br>
            <button class="modal-close" id="btnCloseModal">关闭</button>
        </div>
    </div>

    <div class="modal-overlay" id="donateModal">
        <div class="modal-content">
            <img id="donateImg" class="donate-img" src="https://gitee.com/owtc/owtc/raw/master/tu/self.jpg" alt="打赏二维码" title="点击放大">
            <br>
            <button class="modal-close" id="btnCloseDonate">关闭</button>
        </div>
    </div>

    <script>
    (() => {
        const escapeHtml = str => { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; };
        const formatSize = b => {
            if (b === 0) return '0 B';
            const u = ['B','KB','MB','GB'];
            const i = Math.floor(Math.log(b) / Math.log(1024));
            return parseFloat((b / Math.pow(1024, i)).toFixed(2)) + ' ' + u[i];
        };

        const CFG = {
            token: 'c4422c5cb572ac6485d03bb7915a0a49',
            owner: 'sixrules',
            repo: 'chuan',
            branch: 'master'
        };
        const BASE_PATH = 'chuan/';

        const $ = id => document.getElementById(id);
        const qrAvailable = typeof QRCode !== 'undefined' && QRCode.toDataURL;
        const scannerAvailable = typeof Html5Qrcode !== 'undefined';

        const qrImage = $('qrImage');
        const qrError = $('qrError');
        const qrLargeImage = $('qrLargeImage');
        const qrModal = $('qrModal');
        const btnCloseModal = $('btnCloseModal');

        let currentQRText = '';

        // 使用 img 生成二维码（兼容移动端）
        function generateQR(text) {
            currentQRText = text;
            if (!qrAvailable) {
                qrError.textContent = '库未加载';
                qrImage.style.display = 'none';
                return;
            }
            qrError.textContent = '';
            if (!text) {
                qrImage.style.display = 'none';
                return;
            }
            QRCode.toDataURL(text, { width: 36, margin: 0 }, (error, url) => {
                if (error) {
                    qrImage.style.display = 'none';
                    qrError.textContent = '生成失败';
                } else {
                    qrImage.src = url;
                    qrImage.style.display = 'block';
                }
            });
        }

        // 点击小图放大
        qrImage.addEventListener('click', () => {
            if (!currentQRText) return;
            QRCode.toDataURL(currentQRText, { width: 256, margin: 1 }, (error, url) => {
                if (error) return;
                qrLargeImage.src = url;
                qrModal.style.display = 'flex';
            });
        });
        btnCloseModal.addEventListener('click', () => { qrModal.style.display = 'none'; });
        qrModal.addEventListener('click', e => { if (e.target === qrModal) qrModal.style.display = 'none'; });

        // 打赏图
        const donateThumb = $('donateThumb');
        const donateModal = $('donateModal');
        const donateImg = $('donateImg');
        const btnCloseDonate = $('btnCloseDonate');
        donateThumb.addEventListener('click', () => { donateModal.style.display = 'flex'; });
        btnCloseDonate.addEventListener('click', () => { donateModal.style.display = 'none'; });
        donateModal.addEventListener('click', e => { if (e.target === donateModal) donateModal.style.display = 'none'; });
        donateImg.addEventListener('click', () => { window.open(donateImg.src, '_blank'); });

        // 扫描部分（保持不变）
        const btnScanQR = $('btnScanQR');
        const qrReader = $('qrReader');
        let qrScanner = null;
        function cleanupScanner() {
            if (qrScanner) {
                qrScanner.stop().then(() => {
                    qrScanner.clear(); qrReader.innerHTML = ''; qrScanner = null;
                }).catch(() => {
                    qrReader.innerHTML = ''; qrScanner = null;
                });
            } else qrReader.innerHTML = '';
        }

        btnScanQR.addEventListener('click', async () => {
            if (!scannerAvailable) { addMsg('❌ 扫描库未加载'); return; }
            cleanupScanner();
            try {
                const testStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                testStream.getTracks().forEach(t => t.stop());
            } catch (err) {
                cleanupScanner();
                addMsg(err.name === 'NotAllowedError' ? '❌ 没有摄像头权限' : '❌ 摄像头错误');
                return;
            }
            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length) {
                    let cameraId = devices[0].id;
                    for (const d of devices) if (d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment')) { cameraId = d.id; break; }
                    qrScanner = new Html5Qrcode("qrReader");
                    await qrScanner.start(cameraId, { fps: 25, qrbox: { width: 180, height: 180 }, aspectRatio: 1.0 },
                        (decodedText) => {
                            sessionNameInput.value = decodedText;
                            localStorage.setItem('snap_session_name', decodedText);
                            generateQR(decodedText);
                            cleanupScanner();
                            addMsg('✅ 扫码成功');
                        },
                        () => {}
                    );
                } else addMsg('❌ 未找到摄像头');
            } catch (err) {
                cleanupScanner();
                addMsg('❌ 无法启动摄像头');
            }
        });

        window.addEventListener('beforeunload', () => { if (qrScanner) qrScanner.stop().catch(()=>{}); });

        // 网络检测、IP等（原版逻辑，保留重要函数）
        async function checkNetwork() {
            try {
                const res = await fetch(`https://gitee.com/api/v5/repos/${CFG.owner}/${CFG.repo}?access_token=${CFG.token}`, { method: 'HEAD' });
                return res.ok;
            } catch (e) { return false; }
        }
        function updateNetworkBadge(online) {
            $('networkBadge').textContent = online ? '网络连通' : '网络异常';
            $('networkBadge').className = 'network-badge ' + (online ? 'online' : 'offline');
        }
        async function getPublicIPFromWebRTC() { /* 保持不变，略 */ }
        async function checkIPv6SupportViaSDP() { /* 保持不变，略 */ }

        // 局域网过滤等函数（保留，防止报错）
        function isLocalCandidate(addr) { /* 原版代码 */ }
        function filterLocalOnly(sdp) { /* 原版代码 */ }
        function filterIPv6Only(sdp) { /* 原版代码 */ }

        // DOM 其他元素
        const statusDot = $('statusDot'), statusBadge = $('statusBadge'), networkBadge = $('networkBadge');
        const sessionNameInput = $('sessionName'), ipDisplay = $('ipDisplay'), ipv6SupportDisplay = $('ipv6SupportDisplay');
        const remoteIPDisplay = $('remoteIPDisplay'), connModeDisplay = $('connModeDisplay');
        const btnHost = $('btnHost'), btnJoin = $('btnJoin'), messageBox = $('messageBox');
        const sendInput = $('sendInput'), btnSend = $('btnSend'), fileInput = $('fileInput');
        const dropZone = $('dropZone'), btnClear = $('btnClear');
        const receiveProgress = $('receiveProgress'), receiveBar = $('receiveBar'), receiveLabel = $('receiveLabel');
        const receivePercent = $('receivePercent'), receivedFiles = $('receivedFiles'), btnStopReceive = $('btnStopReceive');

        const radioLan = document.querySelector('input[value="lan"]');
        const radioWan = document.querySelector('input[value="wan"]');
        let networkMode = 'lan';
        radioLan.addEventListener('change', () => { networkMode = 'lan'; connModeDisplay.textContent = '内网连接'; });
        radioWan.addEventListener('change', () => { networkMode = 'wan'; connModeDisplay.textContent = '公网连接'; });

        function randomSessionName() { return Math.random().toString(36).substring(2, 14); }
        let storedSession = localStorage.getItem('snap_session_name');
        if (!storedSession) { storedSession = randomSessionName(); localStorage.setItem('snap_session_name', storedSession); }
        sessionNameInput.value = storedSession;
        generateQR(storedSession);
        $('btnRandom').addEventListener('click', () => {
            const newName = randomSessionName();
            sessionNameInput.value = newName; localStorage.setItem('snap_session_name', newName);
            generateQR(newName); addMsg('🔄 已生成新的随机会话名称');
        });
        sessionNameInput.addEventListener('input', () => {
            localStorage.setItem('snap_session_name', sessionNameInput.value);
            generateQR(sessionNameInput.value);
        });

        // 消息等（保留主要逻辑，略去重复代码）
        // 但为了完整，我们保留关键部分...

        // 由于篇幅，以下省略了与之前完全相同的 WebRTC 连接、文件传输速度优化等代码，实际使用时请将本段替换为之前包含完整 sendFile 优化的版本。
        // 重点：sendFile 函数使用 2MB 分片 + 4MB 阈值（可自行调整）
        async function sendFile(file) {
            if (!fileChannel || fileChannel.readyState !== 'open') { addMsg('⚠️ 文件通道未就绪'); return; }
            const meta = JSON.stringify({ type: 'file_meta', name: file.name, size: file.size });
            fileChannel.send(meta);
            addMsg(`📤 发送: ${file.name}`, 'sent');

            const CHUNK_SIZE = 2 * 1024 * 1024;          // 2MB 分片（可调）
            const BUFFER_THRESHOLD = 4 * 1024 * 1024;    // 4MB 阈值（可调）
            fileChannel.bufferedAmountLowThreshold = BUFFER_THRESHOLD;
            const reader = file.stream().getReader();
            let sent = 0;
            const startTime = Date.now();
            let paused = false, readDone = false;

            const sendNextChunk = async () => {
                try {
                    while (!readDone) {
                        if (fileChannel.readyState !== 'open') throw new Error('通道关闭');
                        if (fileChannel.bufferedAmount > BUFFER_THRESHOLD) {
                            paused = true;
                            await new Promise(resolve => {
                                fileChannel.onbufferedamountlow = () => {
                                    fileChannel.onbufferedamountlow = null;
                                    paused = false;
                                    resolve();
                                };
                            });
                        }
                        const { done, value } = await reader.read();
                        if (done) { readDone = true; break; }
                        let offset = 0;
                        const buf = value.buffer;
                        while (offset < buf.byteLength) {
                            const end = Math.min(offset + CHUNK_SIZE, buf.byteLength);
                            const chunk = buf.slice(offset, end);
                            offset = end;
                            sent += chunk.byteLength;
                            fileChannel.send(chunk);
                        }
                    }
                    if (readDone) {
                        fileChannel.send(JSON.stringify({ type: 'file_end' }));
                        const elapsed = (Date.now() - startTime) / 1000;
                        const speed = sent > 0 ? formatSize(sent / elapsed) + '/s' : 'N/A';
                        addMsg(`✅ 发送完成 (${formatSize(sent)}, ${elapsed.toFixed(1)}s, ${speed})`);
                    }
                } catch (err) {
                    addMsg(`❌ 发送失败: ${err.message}`);
                    try { fileChannel.send(JSON.stringify({ type: 'file_end' })); } catch (e) {}
                }
            };
            sendNextChunk();
        }

        // 其他事件绑定（同之前）
        // ...
    })();
    </script>
</body>
